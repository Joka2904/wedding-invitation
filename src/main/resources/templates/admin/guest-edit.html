<!DOCTYPE html>
<html lang="uz"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mehmonni tahrirlash | Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f7f5;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #555;
            text-decoration: none;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #777;
        }

        .card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 30px;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        .help {
            margin-top: 6px;
            font-size: 13px;
            color: #888;
        }

        .error {
            margin-top: 6px;
            font-size: 13px;
            color: #c62828;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            padding: 11px 18px;
            font: inherit;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: #222;
            color: white;
        }

        .btn-secondary {
            background: #ececec;
            color: #222;
        }
    </style>
</head>

<body>

<div class="container">

    <a th:href="@{/admin/guests}"
       class="back">
        ← Mehmonlar ro'yxatiga qaytish
    </a>

    <h1>Mehmonni tahrirlash</h1>

    <div class="subtitle">
        Taklifnoma ma'lumotlarini o'zgartiring.
    </div>


    <div class="card">

        <form th:action="@{/admin/guests/{id}(id=${guestId})}"
              th:object="${guest}"
              method="post">

            <div class="field">

                <label for="displayName">
                    Mehmon yoki oila nomi
                </label>

                <input id="displayName"
                       type="text"
                       th:field="*{displayName}"
                       required>

                <div class="error"
                     th:if="${#fields.hasErrors('displayName')}"
                     th:errors="*{displayName}">
                    Xatolik
                </div>

            </div>


            <div class="field">

                <label for="greeting">
                    Murojaat
                </label>

                <input id="greeting"
                       type="text"
                       th:field="*{greeting}"
                       required>

                <div class="help">
                    Masalan: Hurmatli Karimovlar oilasi
                </div>

                <div class="error"
                     th:if="${#fields.hasErrors('greeting')}"
                     th:errors="*{greeting}">
                    Xatolik
                </div>

            </div>


            <div class="field">

                <label for="maxGuest">
                    Mehmonlar soni
                </label>

                <input id="maxGuest"
                       type="number"
                       min="1"
                       max="20"
                       th:field="*{maxGuest}"
                       required>

                <div class="error"
                     th:if="${#fields.hasErrors('maxGuest')}"
                     th:errors="*{maxGuest}">
                    Xatolik
                </div>

            </div>


            <div class="buttons">

                <button type="submit"
                        class="btn btn-primary">
                    O'zgarishlarni saqlash
                </button>

                <a th:href="@{/admin/guests}"
                   class="btn btn-secondary">
                    Bekor qilish
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
