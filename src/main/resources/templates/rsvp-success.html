<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Rahmat')}"></head>
<body class="simple-page">
<main class="simple-card">
    <p class="eyebrow">Javobingiz qabul qilindi</p>
    <h1 th:if="${rsvp.attendance == 'YES'}">Siz bilan birga bayram qilishni intiqlik bilan kutamiz!</h1>
    <h1 th:unless="${rsvp.attendance == 'YES'}">Xabar berganingiz uchun rahmat.</h1>
    <p th:text="${invitation.displayName}">Mehmon</p>
    <a class="button button-dark" th:href="@{/invite/{code}(code=${invitation.code})}">Taklifnomaga qaytish</a>
</main>
</body>
</html>
